server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # .wasm, .pck y .js van precomprimidos en la imagen (ver Dockerfile)
  gzip_static on;
  gzip on;
  gzip_types text/css application/javascript text/javascript application/json application/wasm;
  gzip_min_length 1024;

  # no-cache = el navegador revalida con ETag: tras un despliegue se ve la versión nueva,
  # y si nada cambió no se vuelve a descargar el .wasm
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }
}
